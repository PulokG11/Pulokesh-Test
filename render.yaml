services:
  - type: web
    name: coffee-bean-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: INSTRUCTOR_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SCORE_HOURS
        value: "120"
      - key: DATABASE_URL
        sync: false
